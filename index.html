<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UFT-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAMPUS LIFE PLANNER</title>
    <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
    <a class="skip" href="#main">Skip to main content</a>

      <header>
        <h1>Campus Life Planner</h1>
        <p>Plan your assignment , study sessions , meetings and events.</p>
      </header>

      <main id="main">
        <section class="stats" aria-label="Summary">
            <div class="stat-box">
                <span id="totalTasks">0</span>
                <small>TotalTasks</small>
            </div>
            <div class="sta-box">
                <span id="doneTasks">0</span>
                <small>Done</small>
    
            </div>
            <div class="sta-box">
                <span id="Totaltime">0h 0min </span>
                <small>Time left is </small>
            </div>
        </section>
        <selection class="card">
            <h2>Add a new task</h2>
            <form id="taskForm" novalidate>
                <input type="hidden" id="editId" />


                <label for="title">Task title</label>
                <input type="text" id="title" placeholder="e.g Elab assignment" required />
                 

                <label for="Duedate">Due date</label>
                <input type="date" id="duedate" required />


                <label for="duration">Duration</label>
                <input type="number" id="duration" min="2" placeholder="e.g 45" required />


                <label for="tag">Tag</label>
                <select id="tag">
                    <option value="Assignment">Assignment</option>
                    <option value="Study">Study</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Events">Event</option>
                </select>

                 <button type="button" id="CancelEdit" hidden>Cancel</button>

            </form>
        </selection>
        <section class="card">
            <div class="list-header">
                <h2>My tasks</h2>
                <select id="filter">
                    <option value="All">All tags</option>
                    <option value="Assignment">Assignment</option>
                    <option value="Study">Study</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Event">Event</option>
                </select>
            </div>
            <ul id="taskList"></ul>
            <p id="emptyMessage">No task yet. Add your first one!</p>
        </section>
      </main>

      <script type="module" src="scripts/main.js"></script>
</body>
</html>
