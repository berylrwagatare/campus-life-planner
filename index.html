<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UFT-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAMPUS LIFE PLANNER</title>
    <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
    <a class="skip" href="#main">Skip to main content</a>

      <header>
        <h1>Campus Life Planner</h1>
        <p>Plan your assignment , study sessions , meetings and events.</p>
      </header>

      <main id="main">
        <section class="stats" aria-label="Summary">
            <div class="stat-box">
                <span id="totalTasks">0</span>
                <small>TotalTasks</small>
            </div>
            <div class="stat-box">
                <span id="sumDuration">0</span>
                <small>Total planned</small>
    
            </div>
            <div class="stat-box">
                <span id="timeLeft">No cap set </span>
                <small>Time left is </small>
            </div>
        </section>
        <section class="card">
            <h2>Add a new task</h2>
            <form id="taskForm" novalidate>
                <input type="hidden" id="editId" />


                <label for="title">Task title</label>
                <input type="text" id="title" placeholder="e.g Elab assignment" required />
                 

                <label for="dueDate">Due date</label>
                <input type="date" id="dueDate" required />


                <label for="duration">Duration</label>
                <input type="number" id="duration" min="0" placeholder="e.g 45" required />


                <label for="tag">Tag</label>
                <select id="tag">
                    <option value="Assignment">Assignment</option>
                    <option value="Study">Study</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Event">Event</option>
                </select>

                <input type="hidden" id=" editId" />

            
                 <p class="error" id="titleError"></p>
                 <p class="error" id="dateError"></p>
                 <p class="error" id="durationError"></p>
                 <p class="error" id="tagError"></p>


                <button type=" submit" id="SaveBtn">Add Task</button>
                <button type=" button" id="'newTask">New Task</button>
                 <button type="button" id="CancelEdit" hidden>Cancel</button>
                 <p id="formStatus" role="status" aria-live="polite"></p>

            </form>
        </section>

        <section class="card">
            <div class="list-header">
                <h2>My tasks</h2>
                <select id=" ">
                    <option value="All">All tags</option>
                    <option value="Assignment">Assignment</option>
                    <option value="Study">Study</option>
                    <option value="Meeting">Meeting</option>
                    <option value="Event">Event</option>
                </select>
            </div>
            <ul id="taskList"></ul>
            <p id="emptyMessage">No task yet. Add your first one!</p>
        </section>
        <section class="card">
            <h2>Settings</h2>


            <label for="'unit">Duration unit</label>
            <select id ="unit">
                <option value="minutes">Minutes</option>
                <option value="hours">Hours</option>
            </select>
           

            <label for="cap">Time cap(total time you can spend)</label>
            <input type="number" id="cap" min="0" step="any" placeholder="e.g 600" />
            <p id="capStatus" role="status" aria-live="polite"></p>

            <label for "search">Search (regex)</label>
            <input type=" text" id="search" placeholder="e.g ^Elab " />
            <label>input type="checkbox" id="caseInsensitive" checked /> Ignore case </label>
            <p id="searchStatus" role="status"  aria-live="polite"></p>

            <label for="sortKey">Sort by</label>
            <select id=" sortKey">
                <option value="date">Date</option>
                <option value="title">Title</option>
                <option value="duration">Duration</option>
            </select>
            <button type="button" id="exportBtn">Export JSON</button>
            <label for="importFile">Import Json</label>
            <imput type="file" id="importFile" accept="application/json" />
            <button type="button" id="loadseed">load seed.json</button>
            <p id="settingsStatus" role="status" aria-live="polite"></p>
        </section>

        <section class="card">
            <h2>Last 7 days</h2>
            <div id="chart" style="display:flex; align-items:flex-end; gap: 6px; height:100px;"></div>
        </section>
      </main>

      <script type="module" src="scripts/main.js"></script>
</body>
</html>
